# Desktop application release workflow (Windows x64 only, manual trigger only) for beta/stable releases.

name: Build-Desktop-Release

on:
  workflow_dispatch:
    inputs:
      build-target:
        description: 'Build Target (Release Type)'
        type: choice
        required: true
        options:
          - beta
          - non-release
          - release
        default: "non-release"
      git-ref:
        description: "Release Git Ref (Which branch or tag to build?)"
        required: true
        default: "master"
      is-draft:
        description: 'Draft Release? (Beta/Release only)'
        type: boolean
        required: true
        default: true
      is-pre-release:
        description: 'Pre Release? (labeled as "PreRelease")'
        type: boolean
        required: true
        default: true
      enable-file-sync-production:
        description: 'File sync production mode'
        type: boolean
        required: true
        default: true
      enable-plugins:
        description: 'Build with plugin system support'
        type: boolean
        required: true
        default: true

env:
  CLOJURE_VERSION: '1.11.1.1413'
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  compile-cljs:
    runs-on: ubuntu-22.04
    steps:
      # - name: Check build options
      #   if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build-target == 'nightly' || github.event.inputs.build-target == 'beta' || github.event.inputs.build-target == 'release') && github.event.inputs.git-ref != 'master' }}
      #   run: |
      #     echo "::error title=CheckFail::Nightly, Beta and Release builds MUST be built from master"
      #     exit 1

      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn cache directory
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache clojure deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-lib-${{ hashFiles('**/deps.edn') }}

      - name: Setup clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: ${{ env.CLOJURE_VERSION }}

      - name: Retrieve tag version
        id: ref
        run: |
          pkgver=$(node ./scripts/get-pkg-version.js "${{ github.event.inputs.build-target }}")
          echo "version=$pkgver" >> $GITHUB_OUTPUT

      - name: Do Not Overwrite Existing Release
        if: ${{ github.event.inputs.build-target == 'beta' || github.event.inputs.build-target == 'release' }}
        run: |
          if curl -f "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.ref.outputs.version }}" &>/dev/null; then
            echo "::error title=CheckFail::Release already exists"
            exit 1
          fi

      - name: Set Build Environment Variables (only when workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "ENABLE_PLUGINS=${{ github.event.inputs.enable-plugins == 'true' }}" >> $GITHUB_ENV
          echo "ENABLE_FILE_SYNC_PRODUCTION=${{ github.event.inputs.enable-file-sync-production == 'true' }}" >> $GITHUB_ENV

      - name: Compile CLJS
        run: yarn install && gulp build && yarn cljs:release-electron
        env:
          LOGSEQ_SENTRY_DSN: ${{ secrets.LOGSEQ_SENTRY_DSN }}
          LOGSEQ_POSTHOG_TOKEN: ${{ secrets.LOGSEQ_POSTHOG_TOKEN }}

      - name: Update APP Version
        run: |
          sed -i 's/"version": "0.0.1"/"version": "${{ steps.ref.outputs.version }}"/g' ./package.json
        working-directory: ./static

      - name: Display Package.json
        run: cat ./package.json
        working-directory: ./static

      - name: Save VERSION file
        run: echo "${{ steps.ref.outputs.version }}" > ./VERSION
        working-directory: ./static

      - name: List Files
        run: ls -al
        working-directory: ./static

      - name: Cache Static File
        uses: actions/upload-artifact@v7
        with:
          name: static
          path: static

  e2e-test:
    name: E2E Test Shard ${{ matrix.shard }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        shard: [1, 2, 3]
    needs: [ compile-cljs ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download The Static Asset
        uses: actions/download-artifact@v8
        with:
          name: static
          path: static

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            static/yarn.lock

      - name: Fetch yarn deps for E2E test
        run: |
          yarn install
          (cd static && yarn install && yarn rebuild:all)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true

      - name: Install Fluxbox
        run: sudo apt-get update && sudo apt-get install -y fluxbox

      # Emulate a virtual framebuffer on machines with no display hardware
      - name: Run XVFB
        run: |
          Xvfb :1 -noreset -screen 0 1024x768x24 >/dev/null 2>&1 &
          for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X1 ] && break; sleep 0.1; done

      # Start a lightweight window manager to simulate window actions (maximize,restore etc)
      - name: Start Fluxbox
        run: |
          DISPLAY=:1.0 fluxbox >/dev/null 2>&1 &
          sleep 1
          pgrep -x fluxbox >/dev/null

      - name: Run Playwright test
        run: DISPLAY=:1.0 npx playwright test --reporter github --shard=${{ matrix.shard }}/3
        env:
          LOGSEQ_CI: true
          DEBUG: "pw:api"
          RELEASE: true # skip dev only test

  build-windows:
    runs-on: windows-latest
    needs: [ compile-cljs ]
    steps:
      - name: Download The Static Asset
        uses: actions/download-artifact@v8
        with:
          name: static
          path: static

      - name: Retrieve tag version
        id: ref
        run: echo "version=$(cat ./static/VERSION)" >> $env:GITHUB_OUTPUT

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Configure Windows build tools
        shell: pwsh
        run: |
          # Keep build tools outside npm's own package and use a version that supports VS 2026.
          $toolsDir = Join-Path $env:RUNNER_TEMP "windows-build-tools"
          npm install --prefix $toolsDir node-gyp@12.4.0 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nodeGyp = Join-Path $toolsDir "node_modules\node-gyp\bin\node-gyp.js"
          node $nodeGyp --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Yarn's npm shim honors this override; PATH alone still selects npm's bundled node-gyp.
          "npm_config_node_gyp=$nodeGyp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NODE_GYP_FORCE_PYTHON=$(Join-Path $env:pythonLocation 'python.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (Test-Path $wixBin) {
            echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      # - name: Cache Node Modules
      #   uses: actions/cache@v6
      #   with:
      #    path: |
      #      **/node_modules
      #    key: ${{ runner.os }}-node-modules

      - name: Deps Electron app
        run: yarn install
        working-directory: ./static

      # Same targets as knowledge/packaging.md: Squirrel installer + zip, no WiX maker (no .msi)
      - name: Build/Release Electron app
        run: npx electron-forge make --targets "@electron-forge/maker-squirrel,@electron-forge/maker-zip"
        working-directory: ./static
        env:
          DEBUG: electron-packager

      - name: Save Artifacts
        run: |
          mkdir builds
          # NOTE: the release job reads VERSION from the downloaded artifact
          cp static\VERSION builds\VERSION
          mv static\out\make\squirrel.windows\x64\*.exe    builds\Logseq-OG-SE-win-x64-${{ steps.ref.outputs.version }}.exe
          mv static\out\make\squirrel.windows\x64\*.nupkg  builds\Logseq-OG-SE-win-x64-${{ steps.ref.outputs.version }}-full.nupkg
          mv static\out\make\zip\win32\x64\*.zip           builds\Logseq-OG-SE-win-x64-${{ steps.ref.outputs.version }}.zip
          mv static\out\make\squirrel.windows\x64\RELEASES builds\RELEASES

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: logseq-og-se-win64-builds
          path: builds


  release:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build-target == 'beta' || github.event.inputs.build-target == 'release') }}
    needs: [ build-windows, e2e-test ]
    runs-on: ubuntu-22.04
    steps:
      - name: Download The Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: logseq-og-se-win64-builds
          path: ./

      - name: List files
        run: ls -rl

      - name: Retrieve tag version
        id: ref
        run: |
          pkgver=$(cat VERSION)
          echo "version=$pkgver" >> $GITHUB_OUTPUT

      - name: Fix .nupkg name in RELEASES file
        run: |
          sed -i "s/Logseq.*.nupkg/Logseq-OG-SE-win-x64-${{ steps.ref.outputs.version }}-full.nupkg/g" RELEASES

      - name: Generate SHA256 checksums
        run: |
          sha256sum *-win-* > SHA256SUMS.txt
          sha256sum RELEASES >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.ref.outputs.version }}
          name: ${{ github.event.inputs.build-target == 'beta' && format('Desktop APP {0} (Beta Testing)', steps.ref.outputs.version) || format('Desktop APP {0}', steps.ref.outputs.version) }}
          body: "TODO: Fill this changelog. Sorry for the inconvenience!"
          draft: ${{ github.event.inputs.is-draft }}
          prerelease: ${{ github.event.inputs.build-target == 'beta' && github.event.inputs.is-pre-release || false }}
          files: |
            ./VERSION
            ./SHA256SUMS.txt
            ./*.zip
            ./*.exe
            ./*.nupkg
            ./RELEASES
